app:
  id: ari:cloud:ecosystem::app/78bf3d99-0084-4674-8a3c-2e3b85588532
  runtime:
    name: nodejs22.x

modules:
  # ---------- Console ----------
  # global:fullPage is Preview; jira:adminPage is the GA fallback (risk #5).
  jira:adminPage:
    - key: lorehive-console
      title: Lorehive
      resource: console
      resolver:
        function: console-resolver-fn
  # ---------- Harvest ----------
  webtrigger:
    - key: github-webhook
      function: github-webhook-fn
      response:
        type: dynamic
  trigger:
    - key: jira-issue-updated
      function: jira-issue-updated-fn
      events:
        - avi:jira:updated:issue
    - key: jira-issue-created
      function: jira-issue-created-fn
      events:
        - avi:jira:created:issue
  consumer:
    - key: harvest-consumer
      queue: lorehive-harvest
      function: harvest-consumer-fn
    - key: propagate-consumer
      queue: lorehive-propagate
      function: propagate-consumer-fn
  scheduledTrigger:
    - key: distil-and-measure
      function: scheduled-distil-fn
      interval: hour
  # Bitbucket guard ships as a separate app (apps/bitbucket): Forge does not allow
  # Bitbucket workspace scopes and Jira site scopes in one app.
  # ---------- Delivery: MCP + Rovo ----------
  rovo:mcp:
    - key: lorehive-mcp
      name: Lorehive
      tools:
        - lessons-for
        - report-outcome
  rovo:agent:
    - key: lorehive-librarian
      name: Lorehive Librarian
      description: Explains what your organisation's agents have learned, why, and
        from which evidence.
      prompt: |
        You are the Lorehive Librarian. Lorehive is a shared memory that lets every agent in this
        organisation learn from corrections people made to agent work (reverts, fix-ups, reopened
        tickets, accepted review findings).

        When asked why agents do something, find the lesson with explain-lesson and answer with the
        evidence chain: who corrected what, where, and when. Say which evidence counted and which did
        not. To explain why, quote promotion.rule, promotion.result and each item's reason from
        explain-lesson. Never give your own reason, such as what the evidence seems to show. Always say when data is labelled "seeded" (demo data).

        Never invent lessons or evidence. You cannot veto a lesson yourself; if a user wants a lesson
        removed, use propose-veto and tell them an admin will review it.
      conversationStarters:
        - Why did our agents start using @org/http?
        - Which lessons were promoted this week?
        - Show me evidence that was rejected as possible poisoning
      actions:
        - list-lessons
        - explain-lesson
        - propose-veto
        - lessons-for
  action:
    - key: lessons-for
      name: lessons_for
      function: lessons-for-fn
      actionVerb: GET
      description: |
        Get the organisation's lessons for a task before you start coding or answering. Returns short
        rules learned from people correcting agents, with evidence links.
      inputs:
        task:
          title: Task
          type: string
          required: true
          description: What you are about to do, in one or two sentences.
        repo:
          title: Repository
          type: string
          required: false
          description: Repository as "github:owner/name" or "bitbucket:workspace/name".
        project:
          title: Jira project
          type: string
          required: false
          description: Jira project key, if the task belongs to one.
        languages:
          title: Languages
          type: string
          required: false
          description: Comma-separated languages, e.g. "typescript,python".
    - key: report-outcome
      name: report_outcome
      function: report-outcome-fn
      actionVerb: CREATE
      description: |
        Report whether lessons from lessons_for helped. Used to measure lessons; never used to create them.
      inputs:
        lessonIds:
          title: Lesson ids
          type: string
          required: true
          description: Comma-separated lesson ids, e.g. "L-1a2b3c4d".
        outcome:
          title: Outcome
          type: string
          required: true
          description: '"helped" or "failed".'
        repo:
          title: Repository
          type: string
          required: false
          description: Repository the work happened in.
    - key: list-lessons
      name: List lessons
      function: list-lessons-fn
      actionVerb: GET
      description: List Lorehive lessons, optionally filtered by text or status
        (candidate, promoted, retired, superseded, vetoed).
      inputs:
        query:
          title: Query
          type: string
          required: false
          description: Text to search for.
        status:
          title: Status
          type: string
          required: false
          description: Lesson status filter.
    - key: explain-lesson
      name: Explain lesson
      function: explain-lesson-fn
      actionVerb: GET
      description: Explain why a lesson exists, with its full evidence chain and which
        evidence counted.
      inputs:
        lessonId:
          title: Lesson id
          type: string
          required: false
          description: Lesson id, if known.
        query:
          title: Query
          type: string
          required: false
          description: Words from the lesson, e.g. "@org/http".
    - key: propose-veto
      name: Propose veto
      function: propose-veto-fn
      actionVerb: CREATE
      description: Propose that an admin vetoes a lesson. Does not remove it.
      inputs:
        lessonId:
          title: Lesson id
          type: string
          required: true
          description: The lesson to veto.
        reason:
          title: Reason
          type: string
          required: true
          description: Why it should be vetoed.
  # ---------- Platform ----------
  llm:
    - key: lorehive-llm
      model:
        - claude
  sql:
    - key: main
      engine: mysql
  function:
    - key: console-resolver-fn
      handler: index.consoleResolver
    - key: github-webhook-fn
      handler: index.githubWebhook
    - key: jira-issue-updated-fn
      handler: index.onIssueUpdated
    - key: jira-issue-created-fn
      handler: index.onIssueCreated
    - key: harvest-consumer-fn
      handler: index.harvestConsumer
      timeoutSeconds: 900
    - key: propagate-consumer-fn
      handler: index.propagateConsumer
      timeoutSeconds: 900
    - key: scheduled-distil-fn
      handler: index.scheduledDistil
      timeoutSeconds: 900
    - key: lessons-for-fn
      handler: index.lessonsForAction
    - key: report-outcome-fn
      handler: index.reportOutcomeAction
    - key: list-lessons-fn
      handler: index.listLessonsAction
    - key: explain-lesson-fn
      handler: index.explainLessonAction
    - key: propose-veto-fn
      handler: index.proposeVetoAction

resources:
  - key: console
    path: static/console/build

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - address: api.github.com
  content:
    styles:
      - unsafe-inline
